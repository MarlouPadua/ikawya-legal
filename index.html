<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ikawya Legal</title>

    <meta
        name="description"
        content="Privacy Policy and Terms of Use for the ikawya Android application."
    >

    <style>
        :root {
            --background: #f6f7f9;
            --surface: #ffffff;
            --text: #202124;
            --muted: #5f6368;
            --border: #e1e4e8;
            --accent: #3f51b5;
            --accent-hover: #303f9f;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--background);
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
            line-height: 1.7;
        }

        .container {
            width: min(900px, calc(100% - 32px));
            margin: 48px auto;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 48px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
        }

        header {
            margin-bottom: 32px;
            padding-bottom: 28px;
            border-bottom: 1px solid var(--border);
        }

        .app-name {
            margin: 0 0 8px;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .page-title {
            margin: 0 0 12px;
            font-size: 1.6rem;
            font-weight: 600;
        }

        .updated {
            margin: 0;
            color: var(--muted);
            font-size: 0.95rem;
        }

        p {
            margin: 0 0 16px;
        }

        .link-list {
            list-style: none;
            margin: 24px 0 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-list a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 20px 22px;
            background: #f8f9fa;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        .link-list a:hover {
            border-color: var(--accent);
            background: #eef0fb;
            text-decoration: none;
        }

        .link-list span.arrow {
            color: var(--accent);
            font-weight: 700;
        }

        .link-list .sub {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            font-weight: 400;
            font-size: 0.9rem;
        }

        footer {
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.9rem;
            text-align: center;
        }

        @media (max-width: 700px) {
            .container {
                width: min(100% - 20px, 900px);
                margin: 20px auto;
            }

            .card {
                padding: 28px 22px;
                border-radius: 12px;
            }

            .app-name {
                font-size: 2rem;
            }

            .link-list a {
                padding: 16px 18px;
            }
        }
    </style>
</head>

<body>

<main class="container">

    <article class="card">

        <header>
            <p class="app-name">ikawya</p>
            <h1 class="page-title">Legal</h1>
            <p class="updated">
                Legal documents for the ikawya Android application.
            </p>
        </header>

        <p>
            Choose a document below to read it in full.
        </p>

        <ul class="link-list">
            <li>
                <a href="privacy-policy.html">
                    <span>
                        Privacy Policy
                        <span class="sub">How ikawya handles your information</span>
                    </span>
                    <span class="arrow">&rarr;</span>
                </a>
            </li>
            <li>
                <a href="terms-of-use.html">
                    <span>
                        Terms of Use
                        <span class="sub">The rules for using ikawya</span>
                    </span>
                    <span class="arrow">&rarr;</span>
                </a>
            </li>
        </ul>

        <footer>
            &copy; 2026 Marlou Padua. All rights reserved.
        </footer>

    </article>

</main>

</body>
</html>
